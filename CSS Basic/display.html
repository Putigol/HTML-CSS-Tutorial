<!doctype html>
<html>
  <head>
    <style>
      ul {
        padding: 0;
        margin: 0;
      }

      li {
        display: inline-block; /*chiếm vừa đủ không gian*/
        width: 200px;
        border: 1px solid black;
        padding: 5px;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Hiển thị danh sách các liên kết dưới dạng inline:</h1>

    <ul>
      <li><a href="/html/default.asp" target="_blank">HTML</a></li>
      <li><a href="/css/default.asp" target="_blank">CSS</a></li>
      <li><a href="/js/default.asp" target="_blank">JavaScript</a></li>
    </ul>

    <p>
      width: 200px được áp dụng cho các liên kết khi sử dụng display:
      inline-block.
    </p>
  </body>
</html>
