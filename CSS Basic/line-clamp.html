<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Line Clamp</title>
    <style>
      .container {
        width: 400px;
        height: 100px;
        border: 5px solid lightgray;
        padding: 5px;
        border-radius: 16px;
      }

      .line-clamp {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }

      .box {
        width: 250px;
        height: 125px;
        padding: 10px;
        border: 1px solid lightgray;
        border-radius: 8px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <h2>Line Clamp</h2>
        <p class="line-clamp">
          Ngày 7/3, Cơ quan Hàng không Liên bang Mỹ (FAA) thông báo vụ nổ tàu vũ
          trụ Starship của SpaceX một ngày trước đã làm gián đoạn khoảng 240
          chuyến bay, trong đó hơn 20 máy bay phải chuyển hướng do lo ngại về
          mảnh vỡ không gian.
        </p>
      </div>
    </div>
  </body>
</html>
