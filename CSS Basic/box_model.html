<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model</title>
    <style>
      #box1 {
        background-color: lightblue;
        width: 200px;
        height: 200px;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 10px;
      }
      #box2 {
        background-color: lightgreen;
        width: 200px;
        height: 200px;
        padding: 20px;
        margin-bottom: 20px;
      }
      div {
        border: 5px solid black;
        background-color: lightgray;
        margin: 10px 20px;
      }
      div {
        border: 5px solid black;
        background-color: lightgray;
        margin: 10px 20px;
        padding: 20px;
      }
      /* Border style */
      p.none {
        border-style: none;
      }
      /* nét đứt */
      p.dashed {
        border-style: dashed;
      }
      /* nét chấm tròn */
      p.dotted {
        border-style: dotted;
      }
      /* viền liền */
      p.solid {
        border-style: solid;
      }
      /* viền đôi */
      p.double {
        border-style: double;
      }
      /* hỗn hợp */
      p.mixed {
        border-style: solid dashed dotted double;
      }
    </style>
  </head>
  <body>
    <div id="box1">Box 1</div>
    <div id="box2">Box 2</div>
    <p>Cách sử dụng thuộc tính padding và margin</p>
    <div>
      Phần tử div này có margin trên dưới là 10px, margin trái phải là 20px
    </div>
    <div>
      Phần tử div này có padding trên dưới là 20px, padding trái phải là 20px
    </div>
  </body>
</html>
