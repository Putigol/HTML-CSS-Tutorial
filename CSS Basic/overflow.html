<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overflow</title>
    <style>
      .container {
        width: 400px;
        height: 400px;
        border: 5px solid lightgray;
        padding: 5px;
        border-radius: 16px;
        overflow: auto;
        /*
        overflow: hidden;
        overflow: clip;
        overflow-x: hidden;
        overflow-y: auto;
        overflow-clip-margin: content/padding/border-box; xác định phạm vi cho tràn.
        */
      }

      .box {
        width: 200px;
        height: 200px;
        border-radius: 12px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Overflow</h1>
    <div class="container">
      <div class="box" style="background-color: lightblue"></div>
      <div class="box" style="background-color: lightgreen"></div>
      <div class="box" style="background-color: lightyellow"></div>
      <div class="box" style="background-color: lightcoral"></div>
      <div class="box" style="background-color: lightpink"></div>
    </div>
  </body>
</html>
