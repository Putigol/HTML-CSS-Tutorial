<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REM</title>
    <style>
      html {
        font-size: 16px;
      }
      h1 {
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Tiêu đề này có font-size 2rem</h1>
    <p>
      Theo mặc định, font-size của root element có giá trị bằng 16px. <br />
      Khi font-size của html là 16px, thì 1rem sẽ bằng 16px. <br />
      Khi font-size của html là 20px, thì 1rem sẽ bằng 20px.
    </p>
  </body>
</html>
