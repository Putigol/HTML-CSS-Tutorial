<!doctype html>
<html>
  <head>
    <style>
      .div1 {
        width: 200px;
        height: 100px;
        border: 2px solid blue;
      }

      .div2 {
        width: 200px;
        height: 100px;
        padding: 20px;
        border: 2px solid red;
      }
    </style>
  </head>
  <body>
    <h1>Lúc box-sizing != content-box;</h1>

    <div class="div1">
      Div này có chiều rộng 200px (chiều rộng thực tế là 204px; do border là 2px
      mỗi bên).
    </div>
    <br />
    <div class="div2">
      Div này cũng có chiều rộng 200px (chiều rộng thực tế là 244px, do có cả
      padding và border).
    </div>
  </body>
</html>
