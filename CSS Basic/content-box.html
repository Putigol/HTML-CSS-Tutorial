<!doctype html>
<html>
  <head>
    <style>
      .div1 {
        width: 200px;
        height: 100px;
        border: 2px solid blue;
        box-sizing: border-box;
      }

      .div2 {
        width: 200px;
        height: 100px;
        padding: 20px;
        border: 2px solid red;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>Lúc box-sizing = content-box;</h1>

    <div class="div1">Div này có chiều rộng 200px</div>
    <br />
    <div class="div2">Div này cũng có chiều rộng 200px</div>
  </body>
</html>
