<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EM</title>
    <style>
      .container {
        font-size: 28px; /* kích thước phần tử cha (container) */
      }
      .text {
        font-size: 1em; /* kích thước bằng với phần tử cha (container) */
      }
      .btn {
        font-size: 1.2em; /* kích thước bằng 1.2 phần tử cha (container) */
      }
      .icon {
        font-size: 2em; /* kích thước gấp đôi phần tử cha (container) */
      }
    </style>
  </head>
  <body>
    <p>Đây là một đoạn văn nằm ở bên ngoài</p>
    <div class="container">
      <p class="text">Đây là một đoạn văn nằm ở bên trong</p>
      <button class="btn">Nhấn vào</button>
      <span class="icon">❤️</span>
    </div>
  </body>
</html>
