<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image</title>
    <style>
      img {
        border: 1px solid black;
        width: 200px;
        height: 300px; /*auto: tự động điều chỉnh theo width */
        object-fit: cover; /*ảnh phóng to hoặc thu nhỏ lấp đầy khung*/
        /* object-fit: contain; /*ảnh vừa khung*/
        /* object-fit: fill; /*ảnh kéo dãn lấp đày khung*/
        /*object-position: điều chỉnh vị trí ảnh trong phần tử*/
        object-position: left center; /*ảnh nằm bên trái và căn giữa theo chiều dọc*/
      }
    </style>
  </head>
  <body>
    <img src="../assets/babythree1.webp" alt="babythree" />
  </body>
</html>
